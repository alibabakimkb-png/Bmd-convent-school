<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3f1018" />
  <title>BMD Convent School — Office</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" />
  <link rel="stylesheet" href="./mobile.css" />
</head>
<body>
  <div class="phone">
    <section id="login" class="login">
      <img class="crest" src="./crest.svg" alt="BMD" />
      <h1>BMD Convent School</h1>
      <p class="addr">Sanjay Colony, Sector-23<br>33 Feet Road, Near KD Jewellers<br>Office Register · Session 2026–27</p>
      <div class="login-box">
        <div class="field"><label>Staff ID</label><input id="user" value="admin" autocomplete="username" /></div>
        <div class="field"><label>Password</label><input id="pass" type="password" value="admin123" autocomplete="current-password" /></div>
        <button class="btn" onclick="login()">Enter office</button>
        <div id="err" class="hint" style="color:#6b1c28"></div>
        <p class="hint">Office use only</p>
      </div>
    </section>

    <section id="app" class="hidden">
      <header class="head">
        <img src="./crest.svg" alt="" />
        <div>
          <h2>BMD Convent School</h2>
          <small id="who">Staff</small>
        </div>
      </header>
      <div class="screen" id="screen"></div>
      <nav class="tabbar">
        <button class="tab active" data-tab="home" onclick="go('home')"><i>⌂</i>Home</button>
        <button class="tab" data-tab="attend" onclick="go('attend')"><i>✓</i>Attendance</button>
        <button class="tab" data-tab="fees" onclick="go('fees')"><i>₹</i>Fees</button>
        <button class="tab" data-tab="staff" onclick="go('staff')"><i>•</i>Staff</button>
        <button class="tab" data-tab="more" onclick="go('more')"><i>☰</i>More</button>
      </nav>
    </section>
  </div>
  <script src="./store.js"></script>
  <script src="./mobile.js"></script>
</body>
</html>
